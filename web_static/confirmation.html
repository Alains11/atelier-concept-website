<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./styles/main.css">
    <title>Booking Confirmed - Roper</title>
    <style>
        .confirmation-shell {
            max-width: 760px;
            margin: 60px auto;
            padding: 0 20px 60px;
        }
        .confirmation-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 18px;
            padding: 32px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.18);
            color: white;
        }
        .confirmation-badge {
            display: inline-block;
            padding: 6px 10px;
            background: rgba(255, 56, 92, 0.12);
            color: #ff8aa0;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
        }
        .confirmation-card h1 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 16px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 28px;
        }
        .summary-item {
            border: 1px solid #2d2d2d;
            border-radius: 12px;
            padding: 16px;
            background: rgba(255,255,255,0.02);
        }
        .summary-item span {
            display: block;
            color: #b7b7b7;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }
        .summary-item strong {
            font-size: 18px;
        }
        .cta-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }
        .primary-btn, .secondary-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border-radius: 10px;
            padding: 14px 18px;
            font-weight: 700;
            transition: transform 0.2s ease;
        }
        .primary-btn {
            background: #ff385c;
            color: white;
        }
        .secondary-btn {
            border: 1px solid #3a3a3a;
            color: white;
            background: transparent;
        }
        .primary-btn:hover, .secondary-btn:hover {
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <header>
        <a href="/" class="logo">
            <span>roper</span>
        </a>
        <div class="user-menu">
            <a href="/profile.html" class="menu-item">Your bookings</a>
            <div class="profile-btn">
                <span>Menu</span>
            </div>
        </div>
    </header>

    <main class="confirmation-shell">
        <div class="confirmation-card">
            <div class="confirmation-badge">Reservation confirmed</div>
            <h1>Your studio session is locked in.</h1>
            <p id="booking-message">We’ve reserved your space for the dates below.</p>

            <div class="summary-grid">
                <div class="summary-item">
                    <span>Studio</span>
                    <strong id="place-name">Loading...</strong>
                </div>
                <div class="summary-item">
                    <span>Check in</span>
                    <strong id="check-in">--</strong>
                </div>
                <div class="summary-item">
                    <span>Check out</span>
                    <strong id="check-out">--</strong>
                </div>
                <div class="summary-item">
                    <span>Guests</span>
                    <strong id="guest-count">--</strong>
                </div>
            </div>

            <div class="cta-row">
                <a href="/profile.html" class="primary-btn">View profile</a>
                <a href="/" class="secondary-btn">Browse more studios</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-left">
            <span>© 2026 Roper, Inc.</span>
        </div>
        <div class="footer-right">
            <a href="#" class="menu-item">Privacy</a>
            <a href="#" class="menu-item">Terms</a>
            <a href="#" class="menu-item">Sitemap</a>
        </div>
    </footer>

    <script>
        async function loadConfirmation() {
            const params = new URLSearchParams(window.location.search);
            const placeId = params.get('place_id');
            const userId = params.get('user_id') || localStorage.getItem('roper_user_id') || 'demo-user';
            const checkIn = params.get('check_in') || '';
            const checkOut = params.get('check_out') || '';
            const guestCount = params.get('guest_count') || '1';

            document.getElementById('check-in').textContent = checkIn || '--';
            document.getElementById('check-out').textContent = checkOut || '--';
            document.getElementById('guest-count').textContent = guestCount;

            try {
                if (!placeId) {
                    document.getElementById('place-name').textContent = 'Your studio';
                    return;
                }

                const response = await fetch('/api/all/Place');
                const data = await response.json();
                const place = data[placeId];

                if (place) {
                    document.getElementById('place-name').textContent = place.name || 'Studio booking';
                } else {
                    document.getElementById('place-name').textContent = 'Your studio';
                }
            } catch (error) {
                console.error('Error loading confirmation details:', error);
                document.getElementById('place-name').textContent = 'Your studio';
            }

            document.getElementById('booking-message').textContent = `User ${userId} is confirmed for ${checkIn || 'your selected dates'} to ${checkOut || 'your selected dates'}.`;
        }

        window.onload = loadConfirmation;
    </script>
</body>
</html>
